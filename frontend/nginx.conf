server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — send all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the deployed Railway backend container
    location /api/ {
        proxy_pass https://hudsoncrane-production.up.railway.app/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host hudsoncrane-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
