<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hudson & Crane</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafaf9;
      color: #1c1917;
    }

    .header {
      background: linear-gradient(135deg, #292524 0%, #44403c 100%);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: #e7e5e4;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #292524;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 13px;
      font-weight: 600;
      color: #fafaf9;
      letter-spacing: 0.01em;
    }

    .header-text p {
      font-size: 11px;
      color: #a8a29e;
      margin-top: 1px;
    }

    .content {
      padding: 16px;
    }

    .url-preview {
      background: #f5f5f4;
      border: 1px solid #e7e5e4;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .url-preview label {
      font-size: 10px;
      font-weight: 600;
      color: #78716c;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      margin-bottom: 4px;
    }

    .url-preview span {
      font-size: 11px;
      color: #44403c;
      word-break: break-all;
      line-height: 1.4;
      display: block;
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #292524 0%, #44403c 100%);
      color: #fafaf9;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s ease, transform 0.1s ease;
      letter-spacing: 0.01em;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-icon {
      display: flex;
      align-items: center;
    }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
      display: none;
    }

    .status.success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      display: block;
    }

    .status.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      display: block;
    }

    .status.loading {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #475569;
      display: block;
    }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid #e7e5e4;
      font-size: 10px;
      color: #a8a29e;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">H&C</div>
    <div class="header-text">
      <h1>Hudson & Crane</h1>
      <p>Slide Generator</p>
    </div>
  </div>

  <div class="content">
    <div class="url-preview">
      <label>Current Page</label>
      <span id="currentUrl">Loading...</span>
    </div>

    <button class="btn-primary" id="sendBtn">
      <span class="btn-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </span>
      <span id="btnText">Send to Slide Generator</span>
    </button>

    <div class="status" id="status"></div>
  </div>

  <div class="footer">
    Scrapes the current page tab · No login required
  </div>

  <script src="popup.js"></script>
</body>
</html>
